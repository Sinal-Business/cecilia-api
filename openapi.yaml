      summary: Acessos Hotspot de Wi-Fi
      description: Apresenta registros de acesso ao Wi-Fi, com informações de data,
        localização aproximada e perfil de acesso. Permite filtros por período.
      operationId: listarAcessosHotspotShopping
      security:
      - HTTPBearer: []
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Data inicial inclusiva
          title: Start Date
        description: Data inicial inclusiva
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Data final inclusiva; máximo de 31 dias
          title: End Date
        description: Data final inclusiva; máximo de 31 dias
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotspotAccessPage'
        '422':
          description: Validation Error
