openapi: 3.1.0
info:
  title: CECILia API
  description: "\nAPI de serviços da Sinal Business\n\n### ⚠️ Autenticação:  \n\n\
    Para utilizar os recursos é necessário se autenticar utilizando o TOKEN com as\
    \ credenciais fornecidas.  \n\n> Se você não tem esse acesso, contate o time técnico\
    \ responsável  \n\nAs credenciais devem ser informadas no header `Authorization`\
    \ da requisição:\n\n```http\nAuthorization: Bearer TOKEN\nContent-Type: application/json\n"
  version: 2.0.0
servers:
- url: https://sinalbusiness-cecilia-api.onrender.com
paths:
  /validations/name:
    post:
      tags:
      - General
      summary: Validar Nome
      description: 'Valida e formata um nome recebido por qualquer sistema de origem.


        ### Regras aplicadas

        - O valor deve conter entre 2 e 60 caracteres após a remoção de espaços nas
        extremidades

        - Não pode conter números, CPF, CNPJ, endereço de e-mail ou link

        - Aceita letras, espaços, apóstrofos e hífens

        - Cada palavra deve ter pelo menos 2 caracteres, exceto os conectores `da`,
        `de`, `do`, `das`, `dos` e `e`

        - Deve conter pelo menos uma palavra de nome além dos conectores aceitos

        - Rejeita palavras relacionadas a solicitações, como boleto, pagamento, contrato,
        suporte e manutenção

        - Rejeita textos que aparentem ser frases em vez de nomes


        ### Tratamento aplicado

        - Remove espaços no início e no final

        - Substitui sequências de espaços por um único espaço

        - Coloca a inicial de cada palavra em maiúscula e as demais letras em minúscula

        - Mantém os conectores aceitos em minúsculas


        ### Campos retornados

        - `nome_original`: valor recebido após a remoção de espaços nas extremidades

        - `nome_tratado`: nome com espaços e capitalização padronizados

        - `nome_valido`: booleano que indica o resultado da validação

        - `status_nome`: `VALID_NAME` ou `INVALID_NAME`

        - `motivo_nome_invalido`: motivo da rejeição; vazio quando o nome é válido'
      operationId: validarNome
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateNameInput'
        required: true
      responses:
        '200':
          description: Resultado da validação do nome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateNameResponse'
              example:
                nome_original: maria DA silva
                nome_tratado: Maria da Silva
                nome_valido: true
                status_nome: VALID_NAME
                motivo_nome_invalido: ''
        '403':
          description: Token inválido ou ausente
        '422':
          description: Payload inválido
      security:
      - HTTPBearer: []
  /validations/document:
    post:
      tags:
      - General
      summary: Validar Documento
      description: 'Valida CPF ou CNPJ informado na requisição:

        - `valid_doc`: booleano indicando se o documento é válido.

        - `status`: status técnico da validação.

        - `notes`: mensagem pronta para retorno ao usuário. Retorna `null` quando
        o documento é válido.


        ### Regras aplicadas

        - CPF deve conter apenas números

        - CPF deve ter exatamente 11 dígitos

        - CPF não pode conter pontos, traços, letras, espaços ou caracteres especiais

        - CNPJ deve conter apenas letras e números

        - CNPJ deve ter exatamente 14 caracteres

        - CNPJ aceita formato alfanumérico

        - CNPJ não pode conter pontos, barras, traços, espaços ou caracteres especiais

        - Os dois últimos caracteres do CNPJ devem ser números

        - CPF e CNPJ têm os dígitos verificadores validados


        ### Status possíveis

        - `CPF_VALID`

        - `CPF_INVALID_EMPTY`

        - `CPF_INVALID_FORMAT`

        - `CPF_INVALID_LENGTH`

        - `CPF_INVALID_DIGITS`

        - `CNPJ_VALID`

        - `CNPJ_INVALID_EMPTY`

        - `CNPJ_INVALID_FORMAT`

        - `CNPJ_INVALID_LENGTH`

        - `CNPJ_INVALID_DIGITS`

        - `DOCUMENT_INVALID_TYPE`'
      operationId: validarDocumento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateDocumentInput'
              description: Dados para validação do documento. Informe o tipo do documento
                e o valor recebido pela aplicação de origem
        required: true
      responses:
        '200':
          description: Resultado da validação do documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateDocumentResponse'
              examples:
                cpf_valido:
                  summary: CPF válido
                  value:
                    valid_doc: true
                    status: CPF_VALID
                    notes: Obrigada 😊
                cpf_formato_invalido:
                  summary: CPF com formato inválido
                  value:
                    valid_doc: false
                    status: CPF_INVALID_FORMAT
                    notes: Parece que você enviou um CPF com letras, símbolos ou espaços.
                      Por favor, me envie apenas os números 😊
                cpf_quantidade_invalida:
                  summary: CPF com quantidade inválida
                  value:
                    valid_doc: false
                    status: CPF_INVALID_LENGTH
                    notes: O CPF precisa ter exatamente 11 dígitos. Você pode por
                      favor conferir e me mandar novamente? 😊
                cnpj_valido:
                  summary: CNPJ válido
                  value:
                    valid_doc: true
                    status: CNPJ_VALID
                    notes: Obrigada 😊
                cnpj_formato_invalido:
                  summary: CNPJ com formato inválido
                  value:
                    valid_doc: false
                    status: CNPJ_INVALID_FORMAT
                    notes: Parece que você enviou um CNPJ com símbolos, pontuação
                      ou espaços. Por favor, me envie apenas os dígitos 😊
                tipo_invalido:
                  summary: Tipo de documento inválido
                  value:
                    valid_doc: false
                    status: DOCUMENT_INVALID_TYPE
                    notes: Ocorreu um erro na autenticação, por favor envie falar
                      com humano no chat 😊
        '403':
          description: Token inválido ou ausente
        '422':
          description: Payload inválido
      security:
      - HTTPBearer: []
  /adm/client-charge:
    patch:
      tags:
      - Sinal
      summary: Atualizar Cobrança de Cliente
      description: 'Atualiza os campos de cobrança exibidos no módulo Kanban do Financeiro,

        localizando os registros por `contato`.

        O `contato` pode vir com `+`, espaços, hífens ou parênteses; a aplicação

        normaliza o valor para somente números antes da busca.


        Somente os campos abaixo podem ser alterados por este endpoint:

        - `status`

        - `resposta`

        - `dt_projecao_pgto`


        `dt_cobranca` é preenchida automaticamente pela aplicação com a data e hora

        atual sempre que a atualização é processada.'
      operationId: atualizarCobrancaCliente
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientChargeInput'
              description: Dados recebidos via webhook para atualizar a cobrança do
                cliente
        required: true
      responses:
        '200':
          description: Cobrança atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateClientChargeResponse'
        '400':
          description: Nenhum campo de cobrança informado
        '403':
          description: Token inválido ou ausente
        '404':
          description: Nenhuma cobrança encontrada para o filtro informado
        '422':
          description: Payload inválido
        '503':
          description: Falha ao atualizar a cobrança
      security:
      - HTTPBearer: []
