      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialCashBulkCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sinal/finance/cash-transactions/{lancamento}:
    patch:
      tags:
      - Sinal
      summary: Atualizar Movimentacao Financeira (Caixa)
      description: Atualiza somente campos de classificacao autorizados. Para alterar
        valores, datas, empresa, filial, titulo ou identificadores, solicite a alteracao
        ao responsavel tecnico. ult_alteracao e preenchida automaticamente no horario
        de Brasilia.
      operationId: atualizarMovimentacaoFinanceiraCaixa
      security:
      - HTTPBearer: []
      parameters:
      - name: lancamento
        in: path
        required: true
        schema:
          type: integer
          title: Lancamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
